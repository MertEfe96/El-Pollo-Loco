<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/boss.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/coins.class.js"></script>
    <script src="./models/clouds.class.js"></script>
    <script src="./models/background.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/statusbar.class.js"></script>
    <script src="./models/bottle.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./js/game.js"></script>
    <link rel="apple-touch-icon" sizes="180x180" href="./img/favicon/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./img/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./img/favicon/favicon-16x16.png" />
    <link rel="manifest" href="./img/favicon/site.webmanifest" />
    <title>Game</title>
  </head>
  <body onload="init()">
    <h1>EL-POLLO-LOCO</h1>

    <div class="canvasDiv">
      <canvas id="canvas" width="760px" height="480px"> </canvas>
      <div class="canvasMenu">
        <div class="volumeControl" onmouseover="showInput('volumeSlider')" onmouseleave="hideInput('volumeSlider')">
          <img src="./img/11_Icons/Volume_Icon.png" class="volumeIcon" id="volumeIcon" alt="" onclick="muteGame()" />
          <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5" />
        </div>
        <img src="./img/11_Icons/Fullscreen.png" class="fullscreenIcon" onclick="fullscreen()" />
      </div>
      <div class="mobile-controls" id="mobile-controls">
        <div class="mobileDiv jc-sb">
          <button class="mobile-btn" id="btn-left">Left</button>
          <button class="mobile-btn" id="btn-throw">
            <img class="bottleMobileButtonImg" src="./img/6_salsa_bottle/2_salsa_bottle_on_ground.png" alt="" />
          </button>
        </div>
        <div class="mobileDiv">
          <button class="mobile-btn" id="btn-right">Right</button>
          <button class="mobile-btn" id="btn-jump">Jump</button>
        </div>
      </div>
      <div class="introOutro" id="introOutro">
        <div class="overlay-content">
          <div class="screen-panel" id="start-screen">
            <button onclick="startGame()" id="startButton">START</button>
          </div>
          <div class="screen-panel" id="end-screen">
            <p id="endMessage">Game over</p>
            <div class="end-buttons">
              <button onclick="restartGame()" id="restartButton">Restart</button>
              <button onclick="quitGame()" id="quitButton">Back to Menu</button>
            </div>
          </div>
        </div>
      </div>
      <div id="portrait-warning">
        <div class="warning-message">
          <p>Please turn your device</p>
          <span>Use landscape mode for the best game experience.</span>
        </div>
      </div>
    </div>
    <!-- <div id="debug-overlay"><strong>Tasten:</strong> <span id="key-status">---</span></div> -->
    <div id="controls">
      <div class="game-controls">
        <h2>Controls</h2>
        <ul>
          <li>
            <strong>Move:</strong>
            <span class="key">A: Left</span>
            <span class="key">D: Right</span>
          </li>
          <li><strong>Jump:</strong> <span class="key">SPACE</span></li>
          <li><strong>Throw:</strong> <span class="key">E</span></li>
        </ul>
      </div>
    </div>
    <footer>
      <p>&copy; 2023 El-Pollo-Loco. All rights reserved.</p>
      <p><a href="./impressum.html">Impressum</a></p>
    </footer>
  </body>
</html>
